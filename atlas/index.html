<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>童話世界地圖 · 離線典藏</title>
<meta name="description" content="xFairyland / geocities.ws 世界地圖的獨立離線重製。徐大少原圖、ROSS 整合名單，依資料片重排，可搜尋、可走相鄰、可對照原版。">
<link rel="stylesheet" href="atlas.css">
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand" id="brand" title="回到主大陸">
      <div class="brand-mark">圖</div>
      <div>
        <div class="brand-title">童話世界地圖</div>
        <div class="brand-sub">離線典藏 · 獨立輿圖</div>
      </div>
    </div>
    <div id="searchWrap">
      <span class="search-ico">⌕</span>
      <input id="q" type="search" placeholder="搜地名、幻獸、掉寶…" title="按 / 聚焦" autocomplete="off" spellcheck="false">
    </div>
    <button type="button" id="listBtn" class="list-btn">地名</button>
    <div id="views"></div>
  </header>
  <nav id="chips" aria-label="資料片"></nav>
  <div id="sub"></div>
  <div id="work">
    <aside id="rail"></aside>
    <section id="stage"></section>
    <aside id="sheet" hidden></aside>
  </div>
</div>
<script src="data.js"></script>
<script src="atlas.js"></script>
</body>
</html>
