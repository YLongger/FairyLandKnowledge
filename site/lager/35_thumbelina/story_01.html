    <td align="center" valign="top" bgcolor="#FFF7E7"><p class="style1"><span class="style1 style2"><span class="style1">花都之戰 (一) </span></span>
      <form name="form1" method="post" action="">
        <div align="center">
          <textarea name="textarea" cols="59" rows="28" wrap="VIRTUAL">覓兒：這是一個十幾年前的事了……

(時光回到當年…）

—闇神殿內—

前任闇之聖者：布雷娜…很遺憾…妳並沒有資格成為下一任的闇之聖者…

布雷娜：為什麼？我哪一點比不上闇月了？

闇之聖者：布雷娜，妳各方面條件都比他好…是我們闇術師一族中傑出的學員，不僅是在闇法上的造詣，對闇神的信仰也是最深厚的…

布雷娜：既然是這樣，我憑什麼不能當上闇之聖者？

闇之聖者：只是…妳努力的目標與我們闇神殿的宗旨有點不同…在童話世界中是不被允許的…

布雷娜：什麼！？

闇之聖者：金木水火土，五行互相抗衡，光與闇也是一體兩面的，沒有誰輸誰贏，但是妳卻因為自己的好勝心，不斷地去暗中與光神殿的修士們挑釁，甚至偷襲他們，這犯了我們七大神殿很嚴重的紀律…念在妳對闇法上的研究有功…所以我們沒有將你革除留在闇神殿的資格就算最大的容忍了吧，希望妳有一天能夠明白這點…

布雷娜：原來…哼哈哈哈哈哈哈～原來是這樣…死禿驢！我受夠了！我這些年來辛苦努力是為了什麼？還不是希望闇神殿可以凌駕六神殿成為七系法術之尊，難道這也有錯嗎？闇神達克留下的魔法捲軸上，都是記載著強大的魔法，除了攻擊性的空間爆裂術以外、還有可以令敵人由內心自我毀滅的夢魘術…難道將這些法術發揮到頂點，進而征服其他神殿，宣揚闇神的偉大，這不是最好的方法嗎？？

闇之聖者：妳錯了！萬物相生相剋，闇法雖強，但碰到相剋的光法，也會互相抵銷。以妳這樣的想法繼續修練下去，只會越走越偏導致走火入魔，真正要變強是要靠其他系法術互相修練互相輔助，每一個強者都是靠著與隊伍伙伴之間的合作、信任、職業互相配合而成長鍛鍊起來的，向妳這種想要殲滅其他系的獨裁思想，最後只會帶領闇神殿走向滅亡而已…

布雷娜：狗屁！什麼伙伴…朋友…，我不需要這些東西，那是弱者的用的名詞！哼～反正在這裡我已經學到我想要學的了，現在聖者這個懦弱不實的職位，你要給我我也不要了，我要追求更強大的闇之魔法，總有一天我會証明我是對的！

闇之聖者：妳又想去進行那些禁咒實驗嗎？不可以！闇影～闇夜～攔住她！

布雷娜：哼，憑你們？

（布雷娜雙手結印，瞬間闇之聖者、闇影、闇夜三人都無法動彈）
闇之聖者：什麼…這…是闇影纏身？妳什麼時候練成的？

布雷娜：哈～死老鬼，這種簡單的魔法不用你教我也早就會了，而且我還知道如何加強它的效果，怎樣，無法掙脫吧！

闇之聖者：嗚…別太得意…總有一天我會把妳抓回來的…

布雷娜：哼！我忍你已經很久了，這招～就是送你們歸西的…黑‧洞‧爆‧發～～～～

闇之聖者：黑洞爆發！！妳連這都練成了…難道這就是闇神殿的末日嗎…

（轟～～～～～～～～～～～～～）

布雷娜：嗯？沒死…哈～你這膽小鬼，終於出現啦？

闇闇月：老師！！

闇之聖者：謝謝你…但是…我已經不能撐太久了…闇影跟闇夜兩人就請你好好照顧了…你要阻止布雷娜的野心…（斷氣）

布雷娜：哼，闇月，念在同學一場，看你還有點實力，就留你狗命到我禁咒修練而成的那天，到時候我自然會回到這個地方，統治整個闇神殿，進而統治童話王國～啊哈哈哈哈哈～～

（布雷娜雙手一揮，布雷娜的身影開始變得模糊，漸漸消失在闇神殿中）

闇月：是混沌之門嗎…老師…我一定會繼承你的遺志，守護這個地方的…

—金銀城內—

布雷娜：哼，終於離開那個狗屁地方了…現在我終於可以好好研究一下闇法之中的禁咒魔法…嗯…每次研究的對象都是神燈沙漠附近的黑寡婦跟大白豬…難怪我都不會進步…應該找個實在的人來試試…到底怎樣可以讓毒擊術的威力更強…如何完全引發敵人內心的恐懼…哼哈哈哈哈哈哈～嗯…精靈、人類、矮人三大種族都有守衛及各神殿的守護者…不大好找人下手…反正都離開闇神殿了…就到處晃晃吧～

—木偶山山腳—

布雷娜：咦？前面是…花之國都…哈哈～真是一個與世無爭的淨土呀！就先拿這邊下手吧…嗯～我得先假裝一下…免得打草驚蛇…

花國守衛：對不起這位女士…再往前走就是花國的領地了，請問妳有什麼事嗎？

布雷娜：你好，我是即將接任闇神殿聖者的雷娜，我現在正在做童話世界的各國考察旅遊，希望可以對童話世界有更深的了解，這樣可以讓我的法術修練更進一步，進而幫助到日後修練闇法的學子們。

花國守衛：啊啊！原來是聖者大人呀！！沒想到您竟然可以脫穎而出成為下一任的聖者呀，快請進，國王跟王后知道您來了，一定會相當高興的！！

布雷娜：好的～謝謝你

—花國王宮—

國王：啊啊，是聖者大人嗎？

布雷娜：還沒正式上任，叫我娜娜就好了…

國王：沒關係沒關係，想不到我們這個小國也會有神殿的聖者來，真是我們的光榮呀，我聽說神殿的修業是很辛苦的，能夠成為聖者這之間一定經過了不少努力，不知您是否願意留下來成為我們花國的貴賓，內人跟我都很想聽聽妳的故事呢！

布雷娜：好呀，正好我也要做各地考察的工作，那這段期間就請你多多照顧囉

國王：哪的話，來人呀！準備一間上好的荷花屋給雷娜大人，吃完飯後帶她參觀我們花之國都～

布雷娜：謝謝～（哼哼，上勾了）

—散步中—

導遊：不知聖者大人想要了解我們花之國都什麼呢？

布雷娜：嗯…先從居民開始好了～

導遊：好好～能為聖者大人您服務真是無上的光榮，咳咳～我們花之國都是千年前妖精國與仙子國共結連理，兩國合一的王國，男的則為花妖精，女的則為花仙子，由於我們都是生活在大自然中，所以很少與童話居民來往，對童話世界的事也只是一知半解

布雷娜：是喔，嗯嗯…那你們對七大神殿魔法了解有多少？

導遊：這個就不是很清楚了，我們只知道一些童話居民小孩教課書上寫的資料，只知道七大神殿之間互相扶持合作，以魔法來維護童話世界的安全…大概是這樣吧

布雷娜：嗯…謝謝妳的介紹呀…我想先回房休息了

導遊：啊啊～這一路上您一定累了，來來～這就是您的房間～請好好休息，小人告退…

布雷娜：嗯～

—布雷娜暫時住所內—

布雷娜：很好…這裡的居民對魔法是一無所知…又天真笨笨的…正好是我拿來做心靈魔法研究的對象…而且妖精跟仙子的種族特性似乎與我所知道的精靈、矮人、人類有些不同…嗯…我想在這裡一定可以讓我的研究進行地很順利的～哈哈哈哈哈哈哈哈哈哈哈

—隔天—

（扣扣！）

布雷娜：誰呀？

小孩：是聖者大人嗎？我們是花國小學的學生，想見見聖者大人可以嗎？

布雷娜：（小孩…嗯…好主意！）好，我現在就出來喔～

—門外—

小孩們：哇哇！！是聖者大人耶！！

布雷娜：哈哈～不要這樣叫我

老師：啊啊，聖者大人，不好意思，打擾妳的休息，這群孩子實在太不懂事了…

布雷娜：沒關係，我很喜歡小孩的呢，來來來～看看聖者變什麼給你…嘿～

（碰碰碰！空中爆出許多火花）

小孩們：哇哇！！好棒喔！！！！

布雷娜：還有更有趣的喔～

（布雷娜在地上畫出五星結界，瞬間召喚出許多可愛的幻獸）

小孩：哇哇！！好厲害喔～～這是神嗎！！

布雷娜：哈哈～喜歡就帶回去養呀，要好好照顧他們喔～（哼，不過只是黑暗儀式的小把戲就樂成這樣，看來這裡的人真的很單純～哈哈哈哈）

老師：聖者大人，太謝謝你了

布雷娜：沒關係，你們下課有空的時候，可以來找我聽故事喔，我可以告訴你們好多好多有趣的事唷，連國王都想聽呢！

小孩：哇哇！！太棒了！！

老師：太感謝了，聖者大人…

（於是日復一日，布雷娜在花國的地位越來越崇高）

—布雷娜暫時住所內—

布雷娜：嗯…差不多了…該是下手的時候了

可憐的小孩：聖者大人，說故事到囉～

布雷娜：嗯嗯～今天輪到你啦，來來來～快進來吧

可憐的小孩：嗯！！今天要說什麼呢？

布雷娜：今天說的是…

（布雷娜雙手結印，瞬間可憐的小孩就無法動彈）

可憐的小孩：嗚…聖者大人…為什麼我不能動呀？

布雷娜：傻孩子，不要緊張喔，靜靜地睡著吧…做著最深…最恐怖的惡夢吧…

可憐的小孩：嗚啊啊啊啊啊啊啊～～～

（於是恐怖限制級的事情就這樣發生了…一個接著一個…）
