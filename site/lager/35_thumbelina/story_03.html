    <td align="center" valign="top" bgcolor="#FFF7E7"><p class="style1">花都之戰 (三)      
      <form name="form1" method="post" action="">
        
          <div align="center">
          <textarea name="textarea" cols="59" rows="28" wrap="VIRTUAL">—花之國都—

（小公主正沉睡在荷花搖籃之中）

安普利法女巫：多麼可愛的小公主呀…但是…她是花國王族留下來的唯一後代…說什麼也要好好保護她…

麥克法女巫：姐姐…不如…就將她變得跟童話居民一樣好了，這樣布雷娜絕對不會發現她會是花國王族的後代！

安普利法女巫：好主意！那…就用那招吧…我們倆姐妹使出最大法力，將奇蹟之光發揮到極限…改變她的形體…

麥克法女巫：嗯…說什麼也要拼一拼了…對了…大臣先生，可以先請你離開這裡嗎，因為施展此術不能讓外人在場，而且我也希望小公主的秘密不會讓其他人知道

大臣：好好好，那我先出去

（大臣在門外等候）

麥克法女巫：這樣就可以了…這件事…只有我們知道就好了

安普利法女巫：嗯，妹妹～要開始囉…

閃亮雙姐妹：奇蹟…………………………………之光！！！

（荷花搖籃發出一陣強光之後，小公主背後的翅膀不見了）

安普利法女巫：嗯嗯…這麼一來小公主就跟一般童話居民長得一樣了

麥克法女巫：啊！！果然…這個法術…

安普利法女巫：唉…果然是會耗損真元呀…

（麥克法女巫與安普利法女巫兩人瞬間老了100歲）

（兩姐妹走出門外）

大臣：！！請問…兩位…是…（吃驚狀）

安普利法女巫：唉…因為這個法術會極度耗損生命…所以在肉體上看起來…我們已經一百多歲了吧…

大臣：嗚嗚…兩位聖者如此犧牲自己…花國全體上下…嗚嗚…感激不盡…

安普利法女巫：不用客氣…這是我們答應的事…一定會做到…

麥克法女巫：嗯嗯…身為神職人員…就是要為愛奉獻…這點對我們姐妹來說一點影響都沒有^_^

安普利法女巫：從今天起，我們兩姐妹會負責守護花之國都的任務，請你們安心吧，至於小公主…妹妹，你就帶去給附近神燈沙漠的萊菈吧，她是個可以信任的好伙伴！

麥克法女巫：好，我這就去。

—神燈沙漠—

麥克法女巫：萊拉姐姐～萊拉姐姐～

萊拉：妳是…？

麥克法女巫：我是麥克法呀！！安普利法的妹妹呀！妳忘了我嗎？

萊拉：！！？不對呀…怎麼會那麼…嗯…老…？

麥克法女巫：唉…這就說來話長了…

（麥克法將事情來龍去脈說給萊拉聽）

萊拉：原來是這樣呀…辛苦妳們倆姐妹了…放心…守護小公主的任務就包在我身上了！

麥克法女巫：真的嗎？太好了！

（萊拉抱過小公主）

萊拉：多麼可愛的小公主呀…不過很抱歉…為了妳好…所以我必須施法將妳給封印起來…妳會做一個很長很長的美夢…直到我找到合適的人，來帶妳到童話的世界中…成為一個平凡的童話居民，過著平凡快樂的日子…在這段期間…就委曲妳睡在這顆大麥粒裡囉…

（萊拉施法將小公主封印在大麥粒中）

麥克法女巫：嗯…小公主的事就拜託妳了…我要回去幫我姐姐看守花之國都了…

萊拉：沒問題…一切小心囉…

麥克法女巫：嗯！！

—花之國都王宮廣場—

（廣場上聚集著所有倖存的花國居民）

大臣：各位！黑暗的夜晚已經過去了，我們再也不用擔心邪惡的布雷娜侵入我們的家園了，雖然在這場戰役中…國王與王后站在第一線守護著我們…不幸犧牲了…但是我們要堅強起來！不能讓國王與王后的犧牲白費！就讓我們一起…重建花之國都昔日的風采吧！

居民：喔喔喔喔喔！！！！！！！！（歡呼）

            </textarea>
