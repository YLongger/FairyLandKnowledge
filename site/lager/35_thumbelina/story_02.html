    <td align="center" valign="top" bgcolor="#FFF7E7"><p class="style1">花都之戰 (二)     
      <form name="form1" method="post" action="">
        
          <div align="center">
          <textarea name="textarea" cols="59" rows="28" wrap="VIRTUAL">—花國王宮—

守衛：報告！

國王：嗯？有什麼事？

守衛：近來在花國不斷發生孩童離奇失蹤的事…不知道國王對這件事有什麼看法？

國王：這…

守衛：許多孩童都是去聽完聖者大人故事後失蹤的，這點要不要查一下？

國王：混蛋！你怎麼會懷疑到聖者大人頭上，她可是我們的貴賓耶！

守衛：但是…

王后：國王，守衛說的也不是沒有道理，這件事非常嚴重…加上我們的孩子也剛出生不久…我覺得有什麼線索都不能放過…

國王：但是…這要怎麼查呀…

王后：明天你就約聖者大人到東郊狩獵，趁這時再派守衛去她家查一下呀，放心～不會有事的

國王：嗯…好吧～希望日後聖者大人不要見怪…

（由於布雷娜深信花國的人都是白痴，所以毫無藉心就跟著去東郊狩獵了）

—布雷娜暫時住所內—

花國情報員：嗯…進來了，讓我找找這裡有什麼可疑的東西…

（發現小孩的翅膀）

花國情報員：啊啊啊啊！！這是…小孩的翅膀…怎麼會在這裡…若是翅膀掉了這可是很嚴重的外傷呀…為什麼沒聽聖者大人提起…太可疑了！

（發現筆記本）

花國情報員：我看看…嗯…

閱讀筆記本：今天是第12次夢魘術的施放，果然配合毒擊下去…可以令施術者更加虛弱…內心的恐懼會更加深…另外空間魔法的研究也有進一步的突破，花國的小孩果然是最佳的實驗材料，藉由他們特殊的體質，配合生命奪取這個法術，我可以吸收不少純淨的能量…最後再用靈魂奪取抽取他們的精華…再過不久…加強版廣範圍的弱體術跟毒雲術應該可以研究成功…離我的目標又更進了一大步…

花國情報員：這…太可惡了！！我得趕快複製一份拿給國王！！

（晚上，布雷娜回住所，國王也回宮殿後）

—花國王宮—

花國情報員：報告！請下令誅殺雷娜！這就是證據！！

國王：哪尼！？我看看………………………奴喔喔喔喔喔喔喔喔喔喔喔喔！！！！！！

（國王衣服爆裂，全身散發出鬥氣）

國王：我怒了！下令全國護衛隊戒備！全國進入戰爭狀態！！討伐這個萬惡的聖者！

王后：花國情報員，看來這個女巫的來歷有問題，你去闇神殿探探消息，記住，千萬要小心…這方面就靠你了！

花國情報員：是！遵命！ 

—布雷娜暫時住所內—

布雷娜：好吵喔…外面…

（外面護衛隊大喊：受死吧！雷娜！）

布雷娜：什麼！？被發現了嗎…沒關係～就讓他們見試見試真正的闇法的恐怖吧！！

（布雷娜在地上畫出五星結界，瞬間召喚出許多邪惡的闇黑幻獸）

布雷娜：嗯，很好…經過這一段期間的努力…利用黑暗儀式召喚出來的幻獸也比較強大…也比較嗜血啦…哈哈哈～去吧～我的孩子們

（於是一場驚天動地的戰爭開始了…史上人稱花都之戰）

—闇神殿—

花國情報員：請問…這裡有人在嗎？

新任闇之聖者‧闇月：你好，請問有什麼事我可以幫忙的嗎？

花國情報員：請問你是…？

闇月：我是新任的闇之聖者‧闇月

花國情報員：啊？新任的闇之聖者？那雷娜呢？

闇月：雷娜？

花國情報員：喔，是這樣的，有個法力高強的女闇使來到花之國都，說她是闇神殿新上任的闇之聖者…

闇月：咦？你可以大約描述一下她的特徵嗎？

花國情報員：嗯…長得大約是如此如此這般這般，特徵大約是如此如此這般這般…（用寫得真方便）

闇月：啊啊！！那是叛徒布雷娜！！你看～這是當年的闇使結訓畢業照～是不是她？？

花國情報員：是是！！你可以將她的事告訴給我聽嗎？

闇月：好～

（如此如此這般這般地說完之後…）

花國情報員：想不到竟然是這樣…那我也將花國的事告訴給你聽好了…如此如此這般這般…

闇月：哪尼！這下可糟了，我現在就出現前往花國～花國情報員！這封信請交給光神殿裡的聖者，他看到這封信就會明白了！！

花國情報員：好～

—花之國都—

布雷娜：呵哈哈哈哈哈～就憑你們這些蝦兵蟹將～我的闇黑幻獸可是永遠召不完的呀～旋轉吧～闇之精靈～將周圍的空間給吞噬吧！！黑…洞…爆…發～～～

國王：可惡…抵擋不住了嗎～

守衛：國王，請您撤退到王宮內，這裡由我們死守！

國王：不行！我是一國之君！怎麼能退～

王后：夫君～我來助你！

國王：娘子！！妳剛生完孩子不久，身體太虛了～不要過來！

王后：要死一起死～

國王：可惡！雷娜！！我跟你拼了！！

布雷娜：螳臂擋車，不自量力！！加強版～～～黑‧洞‧爆‧發！！

國&王后：嗚啊～

布雷娜：哈哈哈哈哈～本想慢慢跟你們玩的，沒想到被你們識破我的底細，那麼就別怪我無情啦…咦…手怎麼抬不起來…這是…詛咒術？

闇月：布雷娜！！～～～

布雷娜：嗚…闇月…想不到你竟然會來到這裡…

闇月：我不許你再濫殺無辜了！！空間～爆裂！！

（Miss）

布雷娜：這種初級的法術傷得了我嗎？？

闇月：什麼？？

布雷娜：像你這種三腳貓的聖者，只會丟闇神達克的臉，不如由我來清理門戶吧！！上吧～闇黑幻獸～啃蝕這個傢伙的血肉吧～～

闇月：呃啊～～～

（這個時候，突然全花國護衛如同三太子上身，全身充滿無窮的精力，向闇黑幻獸反擊）

闇黑幻獸：ㄠ嗚ㄠ嗚…（狗…）

布雷娜：什麼！？你們哪來的精力？是誰在那邊施咒！？？

（謎之聲：既然你誠心誠意的發問了 那我們就大發慈悲的告訴你！）
（謎之聲：麥克法、安普利法，我們是穿梭在光神殿的閃亮雙姐妹！）
（謎之聲：白色，光亮的明天等著我們！）

麥克法女巫&安普利法女巫：閃亮雙姐妹！在此降臨！！（Ｐｏｓｅ）

布雷娜：…………………………………………………

麥克法女巫：布雷娜，我們已經從花國情報員得知妳的惡行了，現在，我們閃亮雙姐妹就要阻止妳的計畫！！看招～

布雷娜：哼！來得好！就讓我看看光法是要如何剋治闇法吧…來吧！！

（戰鬥開始，回合制）

第一回合：布雷娜使用詛咒術對麥克法女巫->成功！->麥克法變得虛弱
安普利法女巫使用守護術對麥克法女巫->成功！->麥克法恢復健康
麥克法開始念聖言咒…（南無大慈大悲………）
第二回合：布雷娜使用強力夢魘術對麥克法女巫->成功！->麥克法開始恐懼、神智不清
安普利法女巫使用守護術對麥克法女巫->成功！->麥克法恢復健康
麥克法繼續念聖言咒…（道…道…道道道道道～～）
第三回合：布雷娜使用黑洞爆發對閃亮雙姐妹->成功！大傷害->閃亮雙姐妹受到嚴重的傷害
安普利法女巫吟唱回復之語對全體->成功！->閃亮雙姐妹身上的傷口痊癒了
麥克法繼續念聖言咒…（波羅波羅密～～～～）
第四回合：布雷娜使用闇影定身對閃亮雙姐妹->成功！->閃亮雙姐妹無法痛彈

布雷娜：呼呼呼…累死我了～好了～你們都不能動了！看你們怎麼擋得了這招！黑～洞～爆～發！！

安普利法女巫：哼哼～妳以為我們會沒防備地就來找妳嗎？看看妳的腳下吧～

布雷娜：這個是…結界？哼～對我一點影響也沒有，什麼狗屁結界呀！

安普利法女巫：哼哼～你就盡情地用你引以為傲的黑洞爆發吧！

布雷娜：好，這是你自找的～黑～洞～爆～發～～～連發！！！！

（閃亮雙姐妹死亡）

布雷娜：呼呼呼～浪費我這麼多法力～哈哈哈～我贏了！終究闇法才是王道呀！！！

（地下六芒星結界發出強光！兩道白光照住閃亮雙姐妹，兩人又站了起來）

布雷娜：什麼！？

安普利法女巫：你就繼續轟吧，轟到你沒法力為止吧～看我們閃亮雙姐妹的絕技！！聖靈祝福～～～～

（全體花國護衛隊又充滿了戰鬥力，將闇黑幻獸打回黑暗的空間之中）

布雷娜：可惡呀…這樣耗下去不是辦法…難道我真的沒法擊敗光法嗎…不行～我得先離開這裡…你們這兩個白痴雙姐妹，這個仇我一定會討回來的，花國的滅亡是遲早的～餛飩之門…啊～是渾沌之門～再見～

安普利法女巫：等等！

布雷娜：你還想說什麼！

安普利法女巫：我們是閃亮雙姐妹！不是白痴雙姐妹啊啊啊啊～

布雷娜：………………

（布雷娜臉上充滿著三條線，施展渾沌之門離開了這裡）

麥克法女巫：走了呀…我還想再唸金鋼經的說…

安普利法女巫：…………妹妹，先去看花國的人傷得如何吧

守衛：聖者…國王跟王后他們…

（閃亮雙姐妹來到國王與王后面前）

安普利法女巫：奇蹟之光！！！！！！！！

（一股聖光籠罩著國王與王后，但卻一點效果也沒有…）

安普利法女巫：咦？法術失敗？

麥克法女巫：姐姐…他們的體質似乎無法承受我們的魔力…

安普利法女巫：什麼！難道我們就救不了他們嗎？

王后：嗚…不用再浪費兩位的法力救我們了…非常感謝你們來這裡拯救花之國都…我有個最後的請求…希望…你們能守護花之國…還有…保護我的小孩…留住王族最後的血統…不要讓布雷娜傷到她…

安普利法女巫：好的…

國&王后：拜託你們了…（氣絕）

安普利法女巫：…………妹妹，在布雷娜沒死之前，我們必須要守護這裡，也算是對國王與王后的一個交待

麥克法女巫：好的，姐姐。

安普利法女巫：花國的大臣呢？

花國大臣：在在…在這裡…請問聖者大人有什麼吩咐…

安普利法女巫：我們姐妹倆只能暫時趕跑布雷娜而已…目前並沒有辦法殺死她…但是你請放心，為了國王與王后的遺願，我們會在這裡守護花國，直到除去布雷娜的那一天

麥克法女巫：嗯…日後也許還會有闇黑幻獸的侵襲…為了怕傷及無辜…（姐妹倆交換一個眼神）

麥克法女巫：我們會施法將這個花國縮小，讓你們就藏身在木偶山腳這片池塘之中，以防闇黑幻獸查覺，這樣日後跟布雷娜戰鬥也比較不會波及到你們…不過你們不用擔心會因此而完全與外斷絕來往，我們姐妹會守在入口，親自過濾每一位往來花國的人，用法術將他們縮小以及變回原狀～

安普利法女巫：嗯，不知道你們意下如何？

大臣：這這…太感謝兩位聖者的幫助了…無法對外聯絡對我們來說根本無關緊要…我們只是要一個清靜的地方可以生活下去就好了…

安普利法女巫：好…對了…小公主在哪？

大臣：在王宮內院，請兩位聖者跟我來
