        document.form2.luchela.value=luchela+1;
        cost(luchel);
        break;
      }
  }
  switch(rand){
      case 0:
          document.form1.str.value=app[rand];
          break;
      case 1:
          document.form1.agi.value=app[rand];
          break;
      case 2:
          document.form1.int.value=app[rand];
          break;
      case 3:
          document.form1.pow.value=app[rand];
          break;
      case 4:
          document.form1.all.value=app[rand];
          break;
  }  
}
}
//魅力搗蛋藥丸
function allhelb(){
var app=new Array(6);
all=parseInt(document.form1.all.value,10);
app[0]=parseInt(document.form1.str.value,10);
app[1]=parseInt(document.form1.agi.value,10);
app[2]=parseInt(document.form1.int.value,10);
app[3]=parseInt(document.form1.pow.value,10);
app[4]=parseInt(document.form1.luc.value,10);
lev=parseInt(document.form1.lev.value,10);  
allhel=parseInt(document.form2.allhel.value,10);
allhela=parseInt(document.form2.allhela.value,10);
var levr=Math.round(lev/2);
if(lev>9 && all<(lev*3)){
  while(flag6!=0){
      var rand=Math.round(Math.random()*4);
      if(app[rand]<(levr) && flager6[rand]==1){
        flager6[rand]--;
        flag6--;
        break;
      }
      if(app[rand]==(levr+1)){
        flag6--;
        app[rand]--;
        document.form1.all.value=all+1;
        document.form2.allhela.value=allhela+1; 
        cost(allhel);
        break;
      }
      if(app[rand]>levr){
        app[rand]--;
        document.form1.all.value=all+1;
        document.form2.allhela.value=allhela+1; 
        cost(allhel);
        break;
      }
  }
  switch(rand){
      case 0:
          document.form1.str.value=app[rand];
          break;
      case 1:
          document.form1.agi.value=app[rand];
          break;
      case 2:
          document.form1.int.value=app[rand];
          break;
      case 3:
          document.form1.pow.value=app[rand];
          break;
      case 4:
          document.form1.luc.value=app[rand];
          break;
  }
}
}
