<Pre>要去哈辛島的話要從貝伯港靠海附近找哈丁船長傳送
費用好像是550coin吧
傳一次就好囉 傳第二次就會到巴格達
那裡的怪都是陰森魔女和火鳩獸
等級41-48
遇到陰森魔女要小心 他會放123 而且是很難解脫那一種
火鳩獸呢 他是純力的 如果是法師的話
土信仰高一點 通常兩次就趴了
所以遇到火鳩的話不要鎧金 會打的很痛
到那邊順便賜福一下 好閃躲火鳩的攻擊和陰森魔女的123
對了 如果運氣好的話
還可以打倒屬性搗蛋藥丸和黑剛種子喔^^
為了屬搗藥跟黑剛種子努力吧~
