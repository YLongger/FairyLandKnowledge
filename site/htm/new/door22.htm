<Pre>到了B2，路非常簡單，一開始就是往右邊走。

看到了有臉的門，好想闖進去喔。
(如果你身上有使他把噴嚏的藥水，當然可以這樣做囉)(呃……廢話)

但是身上沒藥水，真麻煩，只好跑到右下面點白桌子拿藥水。
拿到藥水使用物品，終於進去了。

但是如果到西迷路森林的門口，又回去星星後面(也就是門之迷宮)的話
有夠倒楣~又飛回有臉的門的外面= =又得在回去拿一次藥水
我就試過一次……唉。
