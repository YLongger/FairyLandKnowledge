<table border=1 width="70%" cellpadding="8" cellspacing="0" bordercolor=#F63E69 bgcolor=#FFC5D3><TR><TD>
<Pre>我是大野狼1的酷酷小凱翔，是個劍戰，以下是我對青蛙沼澤的了解！
你的等級要到16等警衛才會讓你通行，剛進來時，要跟小雪說話，
然後去沼澤四周打怪，注意不可以獨自到沼澤後半段的地圖，
那邊有木蟹和水蛙，而且還會圍毆。等到打到了小雪的金球時，
就趕快回去找小雪說話，獎勵是聲望+500，是個非常好的獎勵喔！

解完任務後，可以在那邊練到22等或23等。
總之，那邊是個好練的地方，不過以水窩蟲居多，青蛙在後半段才有，
到20等之前不可以獨自去後半段練，不然會被護士抬走喔喔！
<font color=red>
大野狼1酷酷小凱翔
