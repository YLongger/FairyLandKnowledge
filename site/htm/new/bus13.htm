<Pre>記得當時我才三十幾等.我就跟族人一起去那邊練.三十幾等

因等級近.所以很好吸驗.那邊怪的普通攻擊都還好.我鎧化了一隻降等的木貝(防破千)不太痛耶.

比起別的地方好打.經驗又多.所以我開始在那邊徘徊不停(像鬼一樣..)

一直練到40等.我就離開到椰子去了(現在42等在巴2練~^^)
