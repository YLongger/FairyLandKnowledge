<Pre>我大約是39.40等級左右來這地方練的，因為月光打得太無聊，所以就跑來這練，
法師來這練還不錯喔，因為怪都是水和金的，就狂放大地之怒和煉獄之火，三兩下就解決了，
一場約5、6隻怪，不多，但很好打，以法師來說（我是土信仰的），
大約在最下角（傳送點下面的地方）那裡是會有40~42的比較多，而且都是水的，
大地放一放兩三回合就贏了，一個不錯的練功地方。
