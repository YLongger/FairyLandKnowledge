那兒的幻獸都是都是土系和金系用木或火的幻獸武化鎧比較好...

秘密平原的下半部的幻獸大多是20~23等的土蜘蛛和金羊
上半部大多是24~26等的惡虎和金獅
可以再下半部練到一定程度在四遇惡虎比較好
