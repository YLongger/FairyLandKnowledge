<Pre>這邊玫瑰湖就要注意一點了
 
其實用土屬性的怪去打還是打的過
 
不過最好不要靠近水神殿 尤其等級沒有滿15的玩家
 
因為那裡幾乎都是19--20級的水娃和木蟹
 
如果要打的話 我教你們寵物配法
 
屬性土神  寵物可以帶土類的或是火類
 
不過比較不建議火類 因為玫瑰湖幾乎都是水性比較多
 
還有 記得剛剛15級去玫瑰湖練的朋友 一定不要走到離星點太遠
 
還有記住要去信土神喔
