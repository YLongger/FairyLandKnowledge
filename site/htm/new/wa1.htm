<Pre>青蛙沼澤在吉恩的右下方~要16等以上守衛才會讓你去.
一進去建議先跟小雪觸發任務.是要幫小雪打到金球的任~
門口是大約19.20等的木蟹和16~18等的水窩蟲~
注意水窩蟲的血很多.是青蛙沼澤血最多的幻獸.
再裡面一點是19.20等的木蟹和水蛙~也會有16~18等的樹蛙.
下方靠右有個缺口是往飛魚角~青蛙沼澤的最右下有個洞穴.
是要打蛙魂的那個任(我也忘了是啥任= =)

青蛙沼澤的一個重點!!!!!!!!!!!!!!==========>很多青蛙= =
