<Pre>大野狼洞窟:

洞窟裡的都是土狼和火狼.攻擊力不是很強.大概打個50~100滴血.
如果要獨自進去.大概要等到35等以上比較保險.

但是獨自進去比較危險.裡面的火狼會使用火焰流星.土狼會使用大地之怒
如果是團體進去.大概等到25~30就可以了.

身多帶著一隻光寵(除非你是光使)進去的話.(最好是寶石獸或是麻屬兔)
獨自進去也沒有什麼好怕的.只要小心他們的大地之怒.火焰流星就ok.

也許打的很差.但是這是第一次寫....請見諒喔~o^0^o~

<font color=red>天藍公主
