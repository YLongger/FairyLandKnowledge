<Pre>ㄏㄏ~我又出現了，我是人類刀戰，
根據我的經驗嘛~去神燈打最好有一隻白羊或是一隻黑熊(其實只要光闇屬性皆可啦)，
把他武化後就可以放心的打了 !!
(一定要武化喔，千萬不要把他鎧化或者是把他放出來讓他一起打，降可是會死的粉慘的唷~)

怪等 20 多級，都是光、闇系，所以用光闇武化後至少都會剋到一種 ~ 
可是鎧化就會被打到很痛了 ~

然後隨著升級你可以愈來愈往裡走，右下方還有闇神殿，不敢進去可以找人帶 ~

如果你有一隻好寵和一堆的藥水想要在這邊快速升等是絕對沒問題的啦 ~
