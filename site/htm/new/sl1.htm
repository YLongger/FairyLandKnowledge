<Pre>第一次去試煉是練功週家族一起組隊的，剛開始看到怪是71-75的有點小害怕，
但後來發現我的火神可以秒，就來越放心，從四個組隊到兩個，現在都單p比較多，

我是6x級就來這挑戰了，還不錯的好地方，夠快升級。
