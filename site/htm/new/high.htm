<Pre>首先,等級一定要超過5等,5等以下多帶點藥,要不然...

我建議是往上面一點走比較好,因為怪的等級高,也可以順便解任務,也方便練等!!
這裡的怪獸等級在4~10之間,血不多,多打幾下會死的,但是也很容易miss...
如果是見習士兵或見習修士應該三兩下就解決了吧...

等高的打個3~5下就死了,等低的話小心喔,有可能你打個10下都還沒死,
你自己卻先掛...

這是我的一點心得,希望對大家有用^^

新手別忘了把害怕峽谷的任務解解喔，對初期很有幫助的 !!
