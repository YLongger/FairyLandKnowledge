<Pre>（位於吉恩村右下～進入等及需１６以上～）

偶速新來的～青蛙沼澤咧～就速青蛙很多＝　＝ａ
丫勒廢話．．．那裡的怪差不多都是１７～２０左右
但有點不像他的名字．．裡面水蝸蟲居多～血也比青蛙多
所以對付他要小心一點點～

在走過沼澤一半時青蛙就開始多嚕～以水蛙居多．．．
等及比樹蛙高個１，２及差不多吧～基本上．．．１６～１８練差不多而已
因為升的不多～適合打樹蛙卡～^^"...

P.s 樹蛙卡是家族之光家族卡難打的卡之一 ~ 打到了可以賣到幾十萬的好價錢喔
