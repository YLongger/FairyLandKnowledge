<td><center><img src=7.gif border="1"></a><TD valign=top>這裡要記得隊長要帶五朵鮮花喔 ( 農事 70 級產物 )！！因為這裡有五座雕像必須要每座都放一朵鮮花後，左邊的傳送石才會開啟，不然無法傳到 8F，只要隊長帶就好。不過有一點要注意的是，要是隊長放花走迷宮走到一半突然當掉，那可是要重新再給花喔，如果真的不幸花不夠，只好花大錢去跟中間的 NPC 買囉。<p>這邊站長把路線畫出來了，一開始先往左下那個雕像獻花，再回到原點，由右往下再往左這樣依序一座座雕像獻花再到左邊的傳石，我想這應該是最快的路線吧。</tr></td></table>
