<td><center><img src=13.gif border="1"></a><TD valign=top  rowspan="3">13F 跟 14F 的地圖是相連的，所以要交互著看喔。<p>
13F 開始你就要注意黑黑的牆壁，其實有些是可以走過去的，延著牆壁走，一開始先由左上往下繞再到右邊的『1』會傳到左上，再來進入『2』的樓梯到了 14F，接下來再由 14F 的『2』從左上往下繞到右邊的『3』上樓回 13F 到『4』的傳送區到下面，接下來路就比較好走了，因為就是單一路線。要提一下的就是當你一到『9』的時候，要往下轉左擠著牆壁走，感覺上沒有路，事實上是可以走的喔。
