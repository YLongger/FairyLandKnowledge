</center>冰原洞窟從寧靜凍原地圖左上有一個小叢林那邊穿過去，走到山背後，從那邊進去 進入點算是很隱密的。不好意思現在暫無圖片資料，請玩家自己去找看看囉 ><，冰原洞窟分B1、B2兩層，是用來練功的。

怪的等級是 140-160，分別為：<br>
160 金光河馬(金) - B2<br>
150 櫻桃薑餅人(火) - B2<br>
140 薄荷薑餅人(水) - B1<br>
150 雪人(光) - B1、B2<br>
150 黑森林蛋糕(闇) - B1、B2
