<TD valign="top"><font color=white><Pre>神殿任務共分為五大類：

1.送信任務(交到指定的神殿聖者手上)

2.提升聲望(以等級的不同規定提升多少聲望)

3.提升經驗(以等級的不同規定提升多少經驗)

4.殺死指定怪物(指定某種怪物限時殺死十隻)

5.殺死指定怪物取得身上神秘礦石

其中打神祕礦石取得到信仰值跟提升聲望是一樣的

打怪物跟提升經驗得到信仰是一樣的

<font color=yellow>幸運越高得到的信仰值越高，所以在解完任務回報時一定要去賜福跟穿上加幸運的裝備

這樣可以賺到更多的信仰喔 :)

<font color=pink>資料測試來源 ---  安徒生敗家一族 " 七月、小幻仔 "
