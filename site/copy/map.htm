<table border=0 width="80%">    <TD> 「童話」的世界建構在一個稱為米司特里亞的古老大陸上，在這裡精靈、人類、和矮人分別創建了各自的國家，由北而南分別是精靈的菲洛爾王國，人類的路加斯王國和矮人的克拉芙王國。菲洛爾王國的首都為青鳥城，國土大多是森林與湖泊地形。路加斯王國首都為彩虹城，國土大部分為富饒的平原。克拉芙王國首都是金銀城，國土大部分為山區、礦區。

      </UL>
